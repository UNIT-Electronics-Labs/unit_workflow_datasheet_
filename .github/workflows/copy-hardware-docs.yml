name: Copy Hardware Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'hardware/**'
      - 'datasheet/**'
      - 'template/**'
      - 'scripts/build_datasheet.sh'
      - '.github/scripts/**'
      - '.github/workflows/copy-hardware-docs.yml'
  pull_request:
    paths:
      - 'hardware/**'
      - 'datasheet/**'
      - 'template/**'
      - 'scripts/build_datasheet.sh'
      - '.github/scripts/**'
      - '.github/workflows/copy-hardware-docs.yml'
  workflow_dispatch: # Permite ejecutar manualmente

permissions:
  contents: write

jobs:
  copy-hardware-docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install document build tools
      run: |
        sudo apt-get update
        sudo apt-get install --yes pandoc fonts-noto-core fonts-noto-mono
        python -m pip install --upgrade pip
        python -m pip install weasyprint

    - name: Build datasheet from Markdown
      run: |
        chmod +x scripts/build_datasheet.sh
        scripts/build_datasheet.sh

    - name: Clean previous documentation
      run: |
        chmod +x .github/scripts/clean_docs.sh
        .github/scripts/clean_docs.sh

    - name: Copy hardware files and generate HTML
      run: |
        chmod +x .github/scripts/build_docs.sh
        .github/scripts/build_docs.sh

    - name: Commit and push changes
      if: github.event_name != 'pull_request'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/
        if ! git diff --cached --quiet; then
          git commit -m "Auto-update hardware documentation [skip ci]"
          git push
        else
          echo "No changes to commit"
        fi
